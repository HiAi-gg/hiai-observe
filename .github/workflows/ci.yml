name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: observe
          POSTGRES_PASSWORD: observe
          POSTGRES_DB: hiai_observe
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://observe:observe@localhost:5432/hiai_observe
      REDIS_URL: redis://localhost:6379
      TENANT_SCOPE_LIVE_DB: "1"
      # INTEGRATION unset: e2e/integration need a booted :8001 and are excluded
      # from this job. Live tenant-scope inserts require TENANT_SCOPE_LIVE_DB=1
      # plus this disposable service DSN (GITHUB_ACTIONS=true). Local runs use
      # observe_test@127.0.0.1/hiai_observe_test instead of app_hiai_observe.
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: Isolated 0003 old-new apply
        env:
          OBSERVE_MIGRATE_LIVE: "1"
        run: bunx vitest run tests/migrations/0003-apply.test.ts
      - name: Run migrations
        run: bun run scripts/migrate.ts
      - name: Live tenant-scope DB tests
        run: bunx vitest run tests/middleware/tenant-scope.test.ts
      - name: Run tests with coverage
        run: bunx vitest run --coverage

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: observe
          POSTGRES_PASSWORD: observe
          POSTGRES_DB: hiai_observe
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://observe:observe@localhost:5432/hiai_observe
      REDIS_URL: redis://localhost:6379
      HIAI_OBSERVE_API_KEY: test-api-key-e2e-00000000000000000000
      ADMIN_API_KEY: test-admin-key-e2e-00000000000000000
      INTEGRATION: "1"
      TENANT_SCOPE_LIVE_DB: "1"
      PORT: "8001"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: Run migrations
        run: bun run scripts/migrate.ts
      - name: Start server
        run: bun src/index.ts &
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/api/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run e2e, integration, and tenant-scope DB tests
        run: bunx vitest run tests/e2e tests/integration tests/middleware/tenant-scope.test.ts

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install and test frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run test

  vite-health:
    name: Vite staff UI health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install frontend
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Start Vite on port 5197
        working-directory: frontend
        run: bun run dev > /tmp/vite-dev.log 2>&1 &
      - name: Probe /hiai-observe health gate
        env:
          VITE_HEALTH_URL: http://127.0.0.1:5197/hiai-observe/
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$VITE_HEALTH_URL" >/dev/null; then
              bun scripts/vite-health-gate.ts
              exit $?
            fi
            sleep 2
          done
          echo "Vite did not become ready on :5197 /hiai-observe/"
          tail -50 /tmp/vite-dev.log || true
          exit 1

  build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run build

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install and build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, build-frontend, e2e, frontend-test, vite-health]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: observe
          POSTGRES_PASSWORD: observe
          POSTGRES_DB: hiai_observe
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build -t hiai-observe:ci .
      - name: Verify healthcheck
        run: |
          docker run -d --name test-app \
            --network host \
            -e DATABASE_URL="postgresql://observe:observe@localhost:5432/hiai_observe" \
            -e REDIS_URL="redis://localhost:6379" \
            -e PORT=8001 \
            hiai-observe:ci
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/api/health)
          echo "Health endpoint returned HTTP $STATUS"
          docker logs test-app 2>&1 | tail -20
          docker rm -f test-app
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: expected HTTP 200 from /api/health, got $STATUS"
            exit 1
          fi
