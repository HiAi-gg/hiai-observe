name: Docker

# Hub publication waits for the CI workflow to succeed on a push (main or v*
# tag). pull_request and workflow_dispatch only build; they never push.
# This does not deploy Coolify/production.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

env:
  IMAGE_NAME: vgalibov/hiai-observe

concurrency:
  group: docker-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build & Push
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      packages: write
    env:
      # Only push when Docker Hub credentials are configured; otherwise build-only.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Confirm SHA is still origin/main before latest
        id: headcheck
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ env.TESTED_SHA }}
        run: |
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          if [ "${BRANCH}" != "main" ]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "${CURRENT}" = "${SHA}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: ${{ env.HAS_DOCKERHUB == 'true' && github.event_name == 'workflow_run' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr
            type=raw,value=sha-${{ env.TESTED_SHA }}
            type=raw,value=latest,enable=${{ steps.headcheck.outputs.latest == 'true' }}
            type=raw,value=${{ github.event.workflow_run.head_branch }},enable=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch != '' && github.event.workflow_run.head_branch != 'main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.HAS_DOCKERHUB == 'true' && github.event_name == 'workflow_run' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
