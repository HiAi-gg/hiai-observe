# App-only. Postgres, Redis, and SeaweedFS are the shared INFRA-01 / DEV-01 host services.
# Do not add postgres/redis/seaweed/minio/caddy here.
# Set DATABASE_URL and REDIS_URL to the shared instance (Coolify env on INFRA-01).

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    mem_limit: 64m
    environment:
      CONTAINERS: 1
      EVENTS: 1
      SYSTEM: 1
      POST: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      GRPC: 0
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run/proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - coolify

  app:
    image: vgalibov/hiai-observe:latest
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point at shared Postgres}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must point at shared Redis}
      PORT: ${PORT:-8001}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-false}
      HIAI_OBSERVE_API_KEY: ${HIAI_OBSERVE_API_KEY:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      DOCKER_HOST: "http://docker-socket-proxy:2375"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - coolify

networks:
  coolify:
    external: true
